name: CI

# Run on every pull request, and on pushes to main so the default branch always has a
# known-good status to compare against.
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# If you push again while a run is still going, cancel the old one. Bevy builds are slow
# enough that this saves real time on a branch you're iterating on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting needs no dependencies and no compilation, so it gets its own job and fails
  # in seconds rather than waiting behind a multi-minute build.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  # Everything that needs a compile shares one job. Splitting clippy and test apart would
  # look tidier in the UI but would compile Bevy twice for no benefit.
  test:
    name: clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Bevy binds to native X11, Wayland, ALSA and udev libraries. Without these the
      # build dies in a dependency's build script — "cannot find -lasound", or "Package
      # wayland-client was not found in the pkg-config search path". This is the step
      # people most often get wrong when putting a Bevy project into CI.
      #
      # libwayland-dev is required even though this job never opens a window. Bevy 0.19
      # turns the `wayland` cargo feature on by default (default -> ui -> default_platform
      # -> wayland), so `wayland-sys` is compiled whether or not a display server exists.
      # Bevy's own Linux docs describe these packages as optional, which only holds if you
      # disable that feature.
      #
      # Must stay identical to the Debian/Ubuntu list in the README's "Install your
      # platform's build dependencies" section.
      - name: Install Bevy's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 \
            libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo and the dependency half of target/. Without this every run
      # recompiles all 530 crates; with it, an unchanged dependency tree restores in
      # under a minute.
      #
      # Only main writes the cache. A cache saved on a PR branch is readable by that
      # PR and nothing else, so letting every branch save just burns the repo's 10 GB
      # cache budget and evicts the entry on main that new PRs actually restore from.
      # PRs still read main's cache — that direction works across branches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `-D warnings` turns clippy lints into build failures. The project is currently
      # clean, and this is what keeps it that way.
      #
      # Both cargo invocations must name the same profile. Different profiles mean
      # separate target/ subdirectories and no shared artifacts between the steps.
      - name: Clippy
        run: cargo clippy --profile ci --all-targets -- -D warnings

      # The 25 tests use `MinimalPlugins`, so they need no window, no GPU and no display
      # server. That is why this works on a plain headless runner with no xvfb.
      - name: Tests
        run: cargo test --profile ci
